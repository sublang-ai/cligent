name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Verify licensing headers
        run: node scripts/verify-license-headers.mjs

      - run: npm run build

      - run: npm run test:package

      - run: npm run test:smoke

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  distributable:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The target verifier reads the shipped runtime descriptor from `dist`
      # (package-16), so the emit has to exist before verification imports it.
      - run: npm run build

      - name: Install exact agent CLIs
        run: npm install -g @google/gemini-cli@0.61.0 @moonshot-ai/kimi-code@2.1.1 opencode-ai@1.18.33

      - name: Verify distributable
        run: npm run test:distributable

  browser:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify portable live approval lifecycle
        run: npm run test:approvals
      - name: Prepare managed browser prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node node_modules/playwright/cli.js install-deps chromium
          # Ubuntu restricts user namespaces for downloaded executables.
          # Admit only these two CI executables; keep Chromium's sandbox on.
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          chromium_path=$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")
          cat > "$RUNNER_TEMP/cligent-browser-apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile cligent-ci-chromium "$chromium_path" flags=(unconfined) {
            userns,
          }
          profile cligent-ci-electron "$RUNNER_TEMP/cligent electron/node_modules/electron/dist/electron" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/cligent-browser-apparmor"
      - name: Install exact native fixture runtimes
        # This lightweight native suite also verifies Gemini attachment bytes
        # through a scripted local provider, without paid-model global setup.
        run: npm install -g @google/gemini-cli@0.61.0 opencode-ai@1.18.33
      - name: Verify native browser, media and question loops
        run: npm run test:browser
      - name: Retain isolated native question failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-question-failure-${{ runner.os }}
          path: ${{ runner.temp }}/cligent-opencode-question-*/failure.json
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
      - name: Install separate Electron host proof runtime
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/cligent electron" --no-save --package-lock=false electron@44.0.0 @electron/asar@4.3.1
          node "$RUNNER_TEMP/cligent electron/node_modules/electron/install.js"
      - name: Verify Electron main and ASAR native browser loops
        shell: bash
        env:
          CLIGENT_ELECTRON_PACKAGE: ${{ runner.temp }}/cligent electron/node_modules/electron
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/verify-electron-host.mjs
            xvfb-run -a node scripts/verify-electron-host.mjs --packaged
          else
            node scripts/verify-electron-host.mjs
            node scripts/verify-electron-host.mjs --packaged
          fi

  acceptance:
    if: github.event_name == 'push'
    needs: [ci, distributable, browser]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install agent CLIs
        run: npm install -g @google/gemini-cli@0.61.0 @moonshot-ai/kimi-code@2.1.1 opencode-ai@1.18.33

      - name: Verify agent CLI targets
        run: node scripts/verify-agent-targets.mjs

      - name: Prepare acceptance browser prerequisites
        # Acceptance runs on a fresh runner, independent of the browser job.
        # Scope Ubuntu's user-namespace permission to managed Chromium only.
        shell: bash
        run: |
          node node_modules/playwright/cli.js install-deps chromium
          chromium_path=$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")
          cat > "$RUNNER_TEMP/cligent-acceptance-apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile cligent-ci-acceptance-chromium "$chromium_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/cligent-acceptance-apparmor"

      - name: Install attached-client driver
        # Real-tmux mouse/key acceptance probes drive an attached client via
        # expect. Without it, those probes self-skip and CI can miss tmux
        # status/message regressions such as WheelUpPane parser errors.
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
          expect -v

      - name: Install glow
        # tmux-play-51 makes glow a hard launcher requirement and tmux-play-150
        # adds a real-glow acceptance probe; without this step the launcher
        # and glow acceptance suites silently self-skip per their broadened
        # skip clauses and CI passes with rotted coverage. ubuntu-latest
        # ships tmux but not glow.
        run: |
          curl -fsSL -o /tmp/glow.deb \
            https://github.com/charmbracelet/glow/releases/download/v2.1.2/glow_2.1.2_amd64.deb
          sudo dpkg -i /tmp/glow.deb
          glow --version

      - name: Configure Kimi acceptance credentials
        env:
          KIMI_CODE_CONFIG_TOML_B64: ${{ secrets.KIMI_CODE_CONFIG_TOML_B64 }}
          KIMI_CODE_CREDENTIALS_JSON_B64: ${{ secrets.KIMI_CODE_CREDENTIALS_JSON_B64 }}
        run: |
          set -euo pipefail
          : "${KIMI_CODE_CONFIG_TOML_B64:?missing KIMI_CODE_CONFIG_TOML_B64 secret}"
          : "${KIMI_CODE_CREDENTIALS_JSON_B64:?missing KIMI_CODE_CREDENTIALS_JSON_B64 secret}"
          kimi_acceptance_home="$RUNNER_TEMP/kimi-code-acceptance"
          install -d -m 0700 "$kimi_acceptance_home/credentials"
          printf '%s' "$KIMI_CODE_CONFIG_TOML_B64" \
            | base64 --decode > "$kimi_acceptance_home/config.toml"
          printf '%s' "$KIMI_CODE_CREDENTIALS_JSON_B64" \
            | base64 --decode > "$kimi_acceptance_home/credentials/kimi-code.json"
          chmod 0600 \
            "$kimi_acceptance_home/config.toml" \
            "$kimi_acceptance_home/credentials/kimi-code.json"
          printf 'CLIGENT_KIMI_ACCEPTANCE_HOME=%s\n' \
            "$kimi_acceptance_home" >> "$GITHUB_ENV"

      - name: Run acceptance tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          # Kimi Code admits an API key only alongside a model name, which is
          # what synthesizes its default alias; a bare MOONSHOT_API_KEY is not
          # admitted. This route replaces the stored OAuth credential, which
          # Kimi's per-refresh token rotation spends on first use.
          KIMI_MODEL_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_MODEL_NAME: kimi-k3
          KIMI_MODEL_BASE_URL: https://api.moonshot.cn/v1
          KIMI_MODEL_PROVIDER_TYPE: kimi
        run: npm run test:acceptance
